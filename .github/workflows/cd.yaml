name: CD - Update Image Tag

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed

jobs:
  update-image-tag:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: vars
        run: echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Update image tag in values-prod.yaml
        run: |
          sed -i "s/tag:.*/tag: ${GITHUB_SHA::7}/" user-service-chart/values-prod.yaml

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add user-service-chart/values-prod.yaml
          git commit -m "Update image tag to ${GITHUB_SHA::7}" || echo "No changes to commit"
          git push