replicaCount: 1

image:
  repository: mujagicamer/cloud-native-user-service
  tag: latest
  pullPolicy: Always

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "100m"

hpa:
  enabled: false

ingress:
  enabled: true
  host: dev.user.test

config:
  APP_ENV: development
  PORT: "3000"