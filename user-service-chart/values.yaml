replicaCount: 2

image:
  repository: mujagicamer/cloud-native-user-service
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  host: user.test

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

config:
  APP_ENV: "production"
  PORT: "3000"

secret:
  DB_PASSWORD: "super-secret-password"